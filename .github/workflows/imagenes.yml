name: Imágenes del Guest

# Construye las imágenes x86_64 y aarch64 (decisión D1), las arranca de verdad y, con un tag
# imagen-vX.Y.Z, las publica junto con el imagenes.json que consume `construct setup`.
on:
  push:
    tags: ["imagen-v*"]
  pull_request:
    paths: ["vm_image/**", ".github/workflows/imagenes.yml"]
  workflow_dispatch:

jobs:
  construir:
    name: Imagen ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            # Runner ARM nativo: sin emulación al compilar jonesy ni al instalar el perfil.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/imagen-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/imagen-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir
        run: vm_image/build_vm.sh --arch ${{ matrix.arch }} --version ${{ steps.version.outputs.version }} --salida dist/imagenes

      - name: Habilitar KVM (si el runner lo expone)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi

      - name: Instalar QEMU
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = x86_64 ]; then sudo apt-get install -y qemu-system-x86; else sudo apt-get install -y qemu-system-arm; fi

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Arrancar la imagen (KVM, o TCG si no hay)
        env:
          CONSTRUCT_IMAGEN_PRUEBA: dist/imagenes/${{ matrix.arch }}
        run: |
          uv sync
          uv run construct doctor || true
          uv run pytest tests/e2e -v -s

      # PLAN §5.1 e2e-kvm: el perfil estudiante de punta a punta por el orquestador del IDE. Sólo con
      # KVM: el runner ARM no lo expone y en TCG cada compilación con ASan tarda minutos (el arranque
      # de arriba ya prueba la imagen aarch64).
      - name: Integración del perfil estudiante y artefactos
        env:
          CONSTRUCT_IMAGEN_PRUEBA: dist/imagenes/${{ matrix.arch }}
        run: |
          if [ -e /dev/kvm ]; then
            uv run pytest tests/test_student_tools_ide.py tests/test_media_artifacts.py -v
          else
            echo "::notice::sin KVM en este runner: la integración del perfil corre sólo en x86_64"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: imagen-${{ matrix.arch }}
          path: dist/imagenes/${{ matrix.arch }}
          retention-days: 7

  # PLAN §5.1 e2e-tcg: los runners alojados de Windows y macOS no exponen WHPX ni HVF, así que la
  # imagen corre emulada (TCG). Es un smoke test de arranque, handshake y herramientas, con tiempos
  # amplios; la aceleración real se verifica en la matriz manual (docs/matriz_manual.md).
  e2e-tcg:
    name: Arranque en TCG (${{ matrix.os }})
    needs: construir
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x86_64
          - os: macos-15
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: imagen-${{ matrix.arch }}
          path: dist/imagenes/${{ matrix.arch }}
      - name: Instalar QEMU (Windows)
        if: runner.os == 'Windows'
        run: choco install qemu -y --no-progress
      - name: Instalar QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Arrancar la imagen
        env:
          CONSTRUCT_IMAGEN_PRUEBA: dist/imagenes/${{ matrix.arch }}
        run: |
          uv sync
          uv run construct doctor || true   # sin WHPX/HVF el diagnóstico avisa que falta la aceleración
          uv run pytest tests/e2e -v -s

  publicar:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/imagen-v')
    needs: construir
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - name: Manifiesto
        run: |
          mkdir -p dist/imagenes
          mv descargas/imagen-x86_64 dist/imagenes/x86_64
          mv descargas/imagen-aarch64 dist/imagenes/aarch64
          python3 vm_image/generar_manifiesto.py dist/imagenes --version "${GITHUB_REF#refs/tags/imagen-v}" --salida dist/release
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --title "Imágenes del Guest ${GITHUB_REF_NAME#imagen-}" \
            --notes "Imágenes x86_64 y aarch64 del Guest de construct. Se instalan con \`construct setup\`."
